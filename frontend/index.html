<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGII - Acceso Corporativo</title>
    <!-- Framework CSS Bootstrap para diseño estructurado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4" style="width: 25rem;">
        <h4 class="text-center mb-4 text-primary">SGII - Abarrotes El Sol</h4>
        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label fw-bold">Correo Electrónico</label>
                <input type="email" id="correo" class="form-control" placeholder="ejemplo@elsol.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Autenticar Sesión</button>
            <div id="mensajeError" class="alert alert-danger mt-3 text-center d-none"></div>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
