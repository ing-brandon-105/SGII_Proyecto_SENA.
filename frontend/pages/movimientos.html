<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGII - Registro de Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-success shadow">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">SGII - Control de Flujo de Mercancía</span>
            <a href="dashboard.html" class="btn btn-sm btn-light">Volver al Panel</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-success">
                    <div class="card-header bg-success text-white fw-bold">
                        Auditoría de Entradas y Salidas
                    </div>
                    <div class="card-body">
                        <form id="formMovimiento">
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Seleccionar Producto</label>
                                <select id="producto_id" class="form-select" required>
                                    <option value="">Inicializando telemetría del catálogo...</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-muted small fw-bold">Tipo de Operación</label>
                                    <select id="tipo_movimiento" class="form-select" required>
                                        <option value="">Seleccione...</option>
                                        <option value="Entrada">Entrada (Sumar Stock)</option>
                                        <option value="Salida">Salida (Restar Stock)</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-muted small fw-bold">Cantidad</label>
                                    <input type="number" id="cantidad" class="form-control" min="1" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold">Ejecutar Transacción</button>
                            <div id="alertaSistema" class="alert mt-3 d-none"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/movimientos.js"></script>
</body>
</html>
