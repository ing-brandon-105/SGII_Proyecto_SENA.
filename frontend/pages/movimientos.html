<!doctype html>
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>SGII | Entradas y Salidas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.3.0/styles/overlayscrollbars.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css" />
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
  <div class="app-wrapper">
    
    <nav class="app-header navbar navbar-expand bg-body shadow-sm">
      <div class="container-fluid">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" data-lte-toggle="sidebar" href="#"><i class="bi bi-list fs-3"></i></a></li>
          <li class="nav-item d-none d-md-block"><span class="nav-link fw-bold">Flujo de Mercancía</span></li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><span id="labelUsuario" class="nav-link fw-bold text-success">Operador...</span></li>
        </ul>
      </div>
    </nav>

    <aside class="app-sidebar bg-dark shadow" data-bs-theme="dark">
      <div class="sidebar-brand p-3 text-center border-bottom border-secondary">
        <span class="brand-text fw-bold fs-4 text-white">SGII - El Sol</span>
      </div>
      <div class="sidebar-wrapper">
        <nav class="mt-3">
          <ul class="nav sidebar-menu flex-column" role="menu">
            <li class="nav-header text-uppercase text-secondary fw-bold small px-3">Operativa</li>
            <li class="nav-item" id="linkDashboard"></li>
            <li class="nav-item"><a href="inventario.html" class="nav-link m-2"><i class="nav-icon bi bi-box-seam text-info"></i><p>Inventario</p></a></li>
            <li class="nav-item"><a href="movimientos.html" class="nav-link active bg-success text-white rounded m-2"><i class="nav-icon bi bi-arrow-left-right"></i><p>Movimientos</p></a></li>
            <li class="nav-item" id="linkUsuarios"></li>
            <li class="nav-item mt-4"><a href="#" id="btnCerrarSesion" class="nav-link m-2 text-danger border border-danger rounded"><i class="nav-icon bi bi-box-arrow-right"></i><p>Salir</p></a></li>
          </ul>
        </nav>
      </div>
    </aside>

    <main class="app-main p-4">
      <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark">Auditoría Transaccional</h3>
            <button class="btn btn-success fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalMovimiento">
                <i class="bi bi-plus-circle me-2"></i>Registrar Flujo
            </button>
        </div>

        <div class="card shadow border-0 rounded-3">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0 text-center">
                <thead class="table-dark">
                  <tr>
                    <th>Ticket</th>
                    <th>Fecha y Hora</th>
                    <th>Producto</th>
                    <th>Operador</th>
                    <th>Tipo</th>
                    <th>Cantidad</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody id="cuerpoTablaMov">
                  </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="modalMovimiento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title fw-bold">Nuevo Registro de Mercancía</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body bg-light">
          <form id="formMovimiento">
            <div class="mb-3">
              <label class="form-label fw-bold small">Seleccionar Producto</label>
              <select id="producto_id" class="form-select form-select-lg" required>
                  <option value="">Cargando catálogo...</option>
              </select>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold small">Naturaleza de Operación</label>
                <select id="tipo_movimiento" class="form-select form-select-lg" required>
                  <option value="">Seleccione...</option>
                  <option value="Entrada">📥 Entrada (Suma)</option>
                  <option value="Salida">📤 Salida (Resta)</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold small">Volumen (Unidades)</label>
                <input type="number" id="cantidad" class="form-control form-control-lg" min="1" required>
              </div>
            </div>
            <div id="alertaSistema" class="alert d-none mt-2"></div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">Ejecutar y Calibrar Stock</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"></script>
  <script src="../js/movimientos.js"></script>
</body>
</html>
